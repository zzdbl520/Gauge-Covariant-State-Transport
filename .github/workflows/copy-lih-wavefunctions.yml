name: Copy archived LiH wavefunction parts
on:
  push:
    paths:
      - ".github/workflows/copy-lih-wavefunctions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-wavefunctions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get source archive
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/zzdbl520/electronic-state-identity.git /tmp/electronic-state-identity
          src=/tmp/electronic-state-identity/data/revision-2026-10-21/wavefunctions
          dst=replay/S12/wavefunctions
          mkdir -p "$dst"
          cp "$src"/wavefunctions.tar.gz.part0* "$dst"/
          cp "$src"/MANIFEST.json "$src"/README.md "$dst"/
          cp /tmp/electronic-state-identity/data/revision-2026-10-21/SOURCE_PROVENANCE.json "$dst"/
      - name: Verify original SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('replay/S12/wavefunctions')
          j=json.loads((p/'MANIFEST.json').read_text())
          for x in j['parts']:
              b=(p/x['name']).read_bytes()
              assert len(b)==x['bytes'], x['name']
              assert hashlib.sha256(b).hexdigest()==x['sha256'], x['name']
              print(x['name'], 'sha256 OK')
          print('All 10 archived wavefunction parts verified.')
          PY
      - name: Commit verified byte-identical archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replay/S12/wavefunctions/
          if git diff --cached --quiet; then
            echo "Already uploaded; no new commit."
          else
            git commit -m "Add original LiH cross-basis NPZ archive parts with checksums"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
